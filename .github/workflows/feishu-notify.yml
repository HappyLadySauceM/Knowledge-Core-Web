name: feishu-notify

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

# Read the event payload; do not write the repository.
# 读取事件正文；不写仓库。
permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: hls-standard
    timeout-minutes: 5
    steps:
      - name: Notify Feishu
        # Pin to the ci-templates commit that added CI-card notify.py.
        # 钉死到加入 CI 卡片的 ci-templates 提交。
        uses: HappyLadySauceM/ci-templates/.github/actions/feishu-notify@5afe5e483d9afc6c886797f9ac8c1226bc73ea7b
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK_URL }}
          secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
