name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_call:
    inputs:
      runner_label:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CPU_PERCENT: "75"

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10.31.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Playwright browser and system dependencies
        if: runner.environment == 'github-hosted'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browser
        if: runner.environment == 'self-hosted'
        run: pnpm exec playwright install chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Storybook build
        run: pnpm build-storybook
