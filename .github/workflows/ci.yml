name: web-pull-request

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_PROJECT_CONFIG: .ci/pipeline.yaml
  NODE_USE_ENV_PROXY: "1"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: hls-standard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          mirror: https://cdn.npmmirror.com/binaries/node
      - name: Install pinned package manager
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@10.31.0
      - name: Install dependencies and run quality gates
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Install Playwright browser
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.npmmirror.com/binaries/playwright
        run: pnpm exec playwright install chromium
      - name: End-to-end tests
        run: pnpm e2e
      - name: Storybook build
        run: pnpm build-storybook
